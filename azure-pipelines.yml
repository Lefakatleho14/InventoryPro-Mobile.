trigger:
  - main

pool:
  name: 'Default'

steps:
- task: Gradle@3
  displayName: 'Run Android Unit Tests'
  inputs:
    gradleWrapperFile: 'gradlew'
    tasks: 'test'
    publishTestResults: true

- task: Gradle@3
  displayName: 'Build Debug APK'
  inputs:
    gradleWrapperFile: 'gradlew'
    tasks: 'assembleDebug'

- task: PublishBuildArtifacts@1
  displayName: 'Publish APK Artifact'
  inputs:
    PathtoPublish: 'app/build/outputs/apk/debug/app-debug.apk'
    ArtifactName: 'drop'